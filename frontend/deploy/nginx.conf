server {
 listen 80;
 root /usr/share/nginx/html;
 index index.html;
 location = /healthz { access_log off; return 200 "ok\n"; }
 location ~ ^/api/incidents/[^/]+/stream$ {
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 90s;
  add_header X-Accel-Buffering no always;
 }
 location /api/ {
  proxy_pass http://backend:8080;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
 location = /mockServiceWorker.js { return 404; }
 location /fixtures/ { return 404; }
 location = /index.html { add_header Cache-Control no-store always; }
 location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
 location / { try_files $uri $uri/ /index.html; }
}
