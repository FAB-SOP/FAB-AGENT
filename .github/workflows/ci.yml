# PR 검사 — 바뀐 모듈만 테스트한다. 공용 계약 · 워크플로가 바뀌면 전체를 돌린다.
# main 브랜치 보호의 필수 검사는 ci-pass 하나다(건너뛴 잡을 필수로 걸면 PR이 대기 상태로 멈춘다).
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.shared == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.shared == 'true' }}
      ai: ${{ steps.filter.outputs.ai == 'true' || steps.filter.outputs.shared == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'ai/contracts/**'
              - '.github/workflows/**'
            backend:
              - 'backend/**'
              - 'data/**'
            frontend:
              - 'frontend/**'
            ai:
              - 'ai/**'
              - 'data/**'
              - 'backend/**'  # ai 테스트는 backend jar를 빌드해 띄운다

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew test --no-daemon

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      # ai/tests/conftest.py가 backend jar를 빌드해 java -jar로 띄운다 — runner 기본 Java는 21이 아니다
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ai/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest

  ci-pass:
    needs: [changes, backend, frontend, ai]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 실행된 잡이 모두 성공했는지 확인 (건너뛴 잡은 통과)
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
