# 인메모리 H2 — Docker 없이 실행 · 테스트용. 실행할 때마다 처음부터 시드한다.
spring:
  datasource:
    url: jdbc:h2:mem:fabcontext;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: ""
  h2:
    console:
      enabled: true
      path: /h2-console
