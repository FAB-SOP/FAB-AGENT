# ops/deploy/deploy.sh up -d --build
# Paths are relative to ai/compose.yaml.
services:
  postgres:
    ports: !override []
    restart: unless-stopped
  backend:
    ports: !override []
    restart: unless-stopped
    environment:
      DEMO_ROUTES: "false"
      FAB_DEMO_PERSONA_SWITCH: ${DEPLOY_DEMO_PERSONA_SWITCH:-false}
  business-mcp:
    restart: unless-stopped
  rag-mcp:
    restart: unless-stopped
    environment:
      EMBEDDER: ${DEPLOY_EMBEDDER:-hash}
      EMBED_MODEL: ${DEPLOY_EMBED_MODEL:-text-embedding-3-small}
      OPENAI_API_KEY: ${DEPLOY_OPENAI_API_KEY:-}
  agent:
    environment:
      FAB_LLM: ${DEPLOY_LLM:-rule}
      FAB_MODEL: ${DEPLOY_MODEL:-gpt-4o-mini}
      FAB_FALLBACK_MODEL: ${DEPLOY_FALLBACK_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${DEPLOY_OPENAI_API_KEY:-}
  web:
    build: ../frontend
    restart: unless-stopped
    logging:             # 나머지 서비스는 ai/compose.yaml의 x-logging(10MB × 3 회전)을 그대로 쓴다
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    ports: ["127.0.0.1:${DEPLOY_WEB_PORT:-8088}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
  smoke:
    environment:
      SPRING_URL: http://web
