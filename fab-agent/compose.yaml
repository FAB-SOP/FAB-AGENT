# 실행: FAB_LLM=rule docker compose up -d --build
# 점검: docker compose --profile tools run --rm --no-deps smoke            (EV-1009 질문 → 승인 → 회신 → 보고서)
# 데이터: 데이터 팩 v2 조립본(../data/fab-causal-pack-v2, data/build_pack_v2.py)과 실제 원문 RAG(../FAB-실제문서-…)를 읽기 전용으로 붙인다.
#        정답(evaluation/) · 생성기는 어느 컨테이너에도 붙이지 않는다 — data/ · knowledge/ · rag/만 마운트
x-health: &health
  interval: 5s
  timeout: 3s
  retries: 30
# 로그는 표준출력으로만 낸다(파일 · 볼륨 없음) — Docker가 받아 두고, 서비스마다 10MB × 3개에서 회전한다.
# 보기: docker compose logs -f agent   (Agent trace는 JSON 한 줄씩, [job] 줄에 작업 요약)
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }


services:
  postgres:
    logging: *logging
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: fab, POSTGRES_PASSWORD: fab, POSTGRES_DB: fab }
    ports: ["55432:5432"]   # backend · agent(체크포인트) · knowledge(벡터) 스키마가 한 DB에 있다
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { <<: *health, test: ["CMD", "pg_isready", "-U", "fab"] }

  backend:               # Spring backend(fab-context-api) — 공개 API(/api/**) · 내부 API(/internal/**)
    logging: *logging
    build: ../fab-context-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fab?currentSchema=backend
      AGENT_MODE: external          # 작업은 아래 agent Worker가 /internal/jobs로 가져간다
      DEMO_ROUTES: "true"           # /internal/demo/faults — 장애 주입 시연
      FAB_PACK_DIR: /bundle/fab-causal-pack-v2      # 묶음 경로의 원본은 여기(compose)다 — 코드에는 기본값이 없다
      FAB_RAG_DIR: /bundle/fab-rag-real-documents-v1
      SERVICE_TOKEN: dev-service-token
    ports: ["8090:8080"]
    volumes:
      - ../data/fab-causal-pack-v2:/bundle/fab-causal-pack-v2:ro   # 조립본에는 정답(evaluation/) · 생성기가 없다
      - ../FAB-실제문서-선별RAG-센서데이터-통합/fab-rag-real-documents-v1/rag:/bundle/fab-rag-real-documents-v1/rag:ro
    healthcheck:
      <<: *health
      # 시드가 끝나야 사건이 보인다 — Tomcat이 먼저 열려도 기다린다
      test: ["CMD-SHELL", "curl -fs -H 'Authorization: Bearer dev-service-token' http://localhost:8080/internal/incidents/EV-1009 >/dev/null"]
    depends_on: { postgres: { condition: service_healthy } }

  business-mcp:          # 업무 MCP — Spring의 /internal/** 만 부른다
    logging: *logging
    build: { context: ., target: runtime }
    command: fab-business-mcp
    environment: { PORT: "9101", BACKEND_URL: "http://backend:8080", SERVICE_TOKEN: dev-service-token }
    healthcheck: { <<: *health, test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/healthz')"] }
    depends_on: { backend: { condition: service_healthy } }

  rag-mcp:               # 지식 MCP — 실제 원문 청크 · 팀 점검 문서 · 가상 사례
    logging: *logging
    build: { context: ., target: runtime }
    command: fab-rag-mcp
    environment:
      PORT: "9102"
      PG_DSN: postgresql://fab:fab@postgres:5432/fab
      # 의미 검색(OpenAI 임베딩)이 기본 — 키는 .env에서 환경 변수로만 받는다(이미지에 넣지 않는다).
      # 키가 없거나 첫 임베딩이 실패하면 시작에 실패하고(healthcheck 실패) agent도 뜨지 않는다.
      # 키 없이 점검: EMBEDDER=hash docker compose up -d
      EMBEDDER: ${EMBEDDER:-openai}
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-small}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FAB_PACK_DIR: /bundle/fab-causal-pack-v2
      FAB_RAG_DIR: /bundle/fab-rag-real-documents-v1
    volumes:
      - ../data/fab-causal-pack-v2/knowledge:/bundle/fab-causal-pack-v2/knowledge:ro
      - ../FAB-실제문서-선별RAG-센서데이터-통합/fab-rag-real-documents-v1/rag:/bundle/fab-rag-real-documents-v1/rag:ro
    healthcheck: { <<: *health, test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9102/healthz')"] }
    depends_on: { postgres: { condition: service_healthy } }

  agent:                 # Agent Worker — Spring의 QUEUED 작업을 가져가 처리하고 결과를 이벤트로 돌려준다
    logging: *logging
    build: { context: ., target: runtime }
    command: fab-worker
    restart: unless-stopped
    environment:
      WORKER_SOURCE: http
      BUSINESS_MCP_URL: http://business-mcp:9101/mcp
      KNOWLEDGE_MCP_URL: http://rag-mcp:9102/mcp
      BACKEND_URL: http://backend:8080
      SERVICE_TOKEN: dev-service-token
      PG_DSN: postgresql://fab:fab@postgres:5432/fab?options=-csearch_path%3Dagent
      FAB_LLM: ${FAB_LLM:-rule}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FAB_MODEL: ${FAB_MODEL:-gpt-4.1-mini}
      FAB_FALLBACK_MODEL: ${FAB_FALLBACK_MODEL:-gpt-4o-mini}
      FAB_TRACE_STDOUT: "true"      # Harness trace를 JSON 한 줄씩 표준출력으로(docker logs)
    depends_on:
      postgres: { condition: service_healthy }
      business-mcp: { condition: service_healthy }
      rag-mcp: { condition: service_healthy }

  smoke:                 # 점검용 — 사람 역할(공개 API)만 하고, 일은 위 agent Worker가 한다
    build: { context: ., target: tools }   # 정답표(evaluation/)는 이 이미지에만 있다
    command: python evaluation/compose_smoke.py
    environment: { SPRING_URL: "http://backend:8080", SERVICE_TOKEN: dev-service-token }
    profiles: [tools]

volumes:
  pgdata:
