spring:
  application:
    name: fab-context-api
  # 기본은 Postgres — ai/compose.yaml의 postgres(호스트 포트 55432)와 같은 DB의 backend 스키마를 쓴다.
  # agent 스키마(체크포인트) · knowledge 스키마(문서 벡터)와 한 DB에 있어 재시작해도 상태가 함께 남는다.
  # 직접 띄울 때: ai/에서 docker compose up -d postgres(postgres만) → ./gradlew bootRun. 매번 처음 데이터는 DDL_AUTO=create
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/fab?currentSchema=backend}
    username: ${DB_USER:fab}
    password: ${DB_PASSWORD:fab}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    # 표를 만든 뒤 schema.sql(엔티티 관계로 걸지 않는 외래 키)을 돌린다
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        default_schema: backend
        hbm2ddl:
          create_namespaces: true

  sql:
    init:
      mode: always
      # schema.sql 전체를 한 문장으로 — DO 블록의 세미콜론에서 자르지 않는다(ScriptUtils.EOF_STATEMENT_SEPARATOR)
      separator: "^^^ END OF SCRIPT ^^^"

server:
  port: ${PORT:8090}
  servlet:
    session:
      timeout: 8h
      cookie:
        name: FABSESSION
        http-only: true
        same-site: lax

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

fab:
  # 센서·계측 시뮬레이터가 POST /api/events/anomalies 호출 시 사용하는 서비스 토큰
  service-token: dev-simulator-token
  # fab-agent(업무 MCP · Worker)가 /internal/** 를 부를 때 쓰는 토큰 — fab-agent의 SERVICE_TOKEN과 같아야 한다
  internal-token: ${SERVICE_TOKEN:dev-service-token}
  approval-ttl: PT24H
  seed:
    enabled: true
  # 데이터 팩은 조립본(../data/fab-causal-pack-v2)을, 실제 원문 RAG는 동료 묶음(../data/fab-rag-real-documents-v1)을 그대로 읽는다. evaluation/은 어디에도 없다
  # 데이터 팩: run · 계측 · 센서 · 관리한계 · 정비 이력 · 가상 사례 · 팀 점검 문서
  # v2(causal-pack-v2.1-scenarios) = v1 + L006 CMP-PM3 수정 + sensorEnvelopes + L011 · L012 추가. data/build_pack_v2.py가 v1 · v2 · 추가 묶음에서 조립한다
  # 경로 기본값은 없다(없으면 시작 실패) — 원본은 compose 환경 변수. 직접 띄울 때: FAB_PACK_DIR=../data/fab-causal-pack-v2
  pack-dir: ${FAB_PACK_DIR:}
  # 실제 원문 선별 RAG: rag/source-chunks.jsonl만 색인한다(originals · selected는 열람용)
  # 직접 띄울 때: FAB_RAG_DIR=../data/fab-rag-real-documents-v1
  rag-dir: ${FAB_RAG_DIR:}
  # 시연 · 평가 전용 경로(/internal/demo/** — 장애 주입). 운영에서는 끈다
  demo-routes: ${DEMO_ROUTES:false}
  demo-persona-switch: ${FAB_DEMO_PERSONA_SWITCH:false}
  agent:
    # 시뮬레이션 Agent의 단계별 지연(ms). QUEUED → RUNNING → 완료
    step-delay-ms: 1500
    # 0~1. 분석 작업 실패 확률(실패 흐름 시연용). 질문에 [fail]을 넣어도 실패시킬 수 있다.
    failure-rate: 0.0
    # simulator: 서버 안 시뮬레이터가 작업 처리 / external: fab-agent Worker가 /internal/jobs로 가져가 처리
    mode: ${AGENT_MODE:simulator}

logging:
  level:
    com.fabcontext: INFO
