# scripts/deploy.sh up -d --build
# Paths are relative to fab-agent/compose.yaml.
services:
  postgres:
    ports: !override []
    restart: unless-stopped
  backend:
    ports: !override []
    restart: unless-stopped
    environment:
      DEMO_ROUTES: "false"
  business-mcp:
    restart: unless-stopped
  rag-mcp:
    restart: unless-stopped
    environment:
      EMBEDDER: ${DEPLOY_EMBEDDER:-hash}
      EMBED_MODEL: ${DEPLOY_EMBED_MODEL:-text-embedding-3-small}
      OPENAI_API_KEY: ${DEPLOY_OPENAI_API_KEY:-}
  agent:
    environment:
      FAB_LLM: ${DEPLOY_LLM:-rule}
      FAB_MODEL: ${DEPLOY_MODEL:-gpt-4o-mini}
      FAB_FALLBACK_MODEL: ${DEPLOY_FALLBACK_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${DEPLOY_OPENAI_API_KEY:-}
  web:
    build: ../fab-context-web
    restart: unless-stopped
    ports: ["127.0.0.1:${DEPLOY_WEB_PORT:-8088}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
  smoke:
    environment:
      SPRING_URL: http://web
